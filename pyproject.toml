[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "plateproof"
version = "0.1.0"
description = "Evidence-based restaurant inspection intelligence for NYC and Florida"
requires-python = ">=3.12,<3.14"
dependencies = [
  "polars>=1.12,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "tzdata>=2024.1",  # IANA tz database for zoneinfo on Windows (polars UTC datetimes)
  "fastexcel>=0.12,<1",  # local, free XLSX reader used by polars.read_excel (Florida historical archives)
  "rapidfuzz>=3.9,<4",  # local, free (MIT) fuzzy string matching for restaurant-name similarity
  "scikit-learn>=1.6,<2",  # local, free (BSD); >=1.6 required for sklearn.frozen.FrozenEstimator
  "joblib>=1.4,<2",  # local, free (BSD); explicit model-artifact serialization
  "numpy>=1.26,<3",  # local, free (BSD); used directly for model matrices/bootstrap resampling
  "fastapi>=0.115,<1",  # local, free (MIT); Task 7 service layer
  "uvicorn>=0.30,<1",  # local, free (BSD); ASGI server for the FastAPI app
  "streamlit>=1.38,<2",  # local, free (Apache-2.0); Task 7 MVP interface
  "duckdb>=1.1,<2",  # local, free (MIT); embedded SQL over local Parquet, no server
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "httpx>=0.27,<1",  # local, free (BSD); required by fastapi.testclient.TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
# The specification under docs/ is the design authority and is not project source;
# do not lint or reformat code snippets embedded in it.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008 (function call in default arg) is FastAPI's own required pattern for
# Depends(...); flagging it project-wide would be noise, not a real issue.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["plateproof"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
