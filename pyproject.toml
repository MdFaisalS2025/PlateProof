[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "plateproof"
version = "0.1.0"
description = "Evidence-based restaurant inspection intelligence for NYC and Florida"
requires-python = ">=3.12,<3.14"
dependencies = [
  "polars>=1.12,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "tzdata>=2024.1",  # IANA tz database for zoneinfo on Windows (polars UTC datetimes)
  "fastexcel>=0.12,<1",  # local, free XLSX reader used by polars.read_excel (Florida historical archives)
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
# The specification under docs/ is the design authority and is not project source;
# do not lint or reformat code snippets embedded in it.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["plateproof"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
